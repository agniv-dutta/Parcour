databases:
  - name: parcour-postgres
    databaseName: parcour
    user: parcour

  - type: web
    name: parcour-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: parcour-postgres
          property: connectionString
      - key: CLAUDE_API_KEY
        sync: false
