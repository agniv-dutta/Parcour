services:
  - type: web
    name: parcour-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CLAUDE_API_KEY
